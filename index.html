<!DOCTYPE html>
<html lang="en" class="dark transition-colors duration-300">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyzen - Portofolio</title>
  <meta property="og:title" content="Kyzen - Personal Portfolio" />
  <meta property="og:description" content="Personal web portofolio." />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black text-white dark:bg-black dark:text-white transition-colors duration-300">

  <!-- MENU TITIK TIGA (DI PORTOFOLIO) -->
  <div class="fixed top-4 right-4 z-[100] animate-fade-in-up">
    <button id="menu-btn" onclick="toggleMenu(event)" class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition-all duration-300 shadow-lg">
      <i class="fas fa-ellipsis-v text-lg"></i>
    </button>

    <div id="dropdown-menu" class="absolute right-0 mt-3 w-52 rounded-2xl bg-[#121212]/95 backdrop-blur-xl border border-white/10 shadow-2xl p-2 transform scale-95 opacity-0 invisible transition-all duration-200 ease-out origin-top-right flex flex-col gap-1">
      <!-- Menu 1: Portofolio -->
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-300 hover:text-white hover:bg-white/10 transition-colors">
        <i class="fas fa-home text-gray-400 w-4 text-center"></i>
        <span>Portofolio</span>
      </a>
      <!-- Menu 2: AMFinder -->
      <a href="amfinder.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-300 hover:text-white hover:bg-white/10 transition-colors">
        <i class="fas fa-search text-gray-400 w-4 text-center"></i>
        <span>AMFinder</span>
      </a>
    </div>
  </div>

  <!-- Banner -->
  <div class="banner relative animate-fade-in-up"></div>

  <!-- Profile Image -->
  <div class="flex justify-center relative -mt-16 z-20 animate-fade-in-up delay-100">
    <div class="w-32 h-32 bg-[#1a1a1a] rounded-full flex items-center justify-center shadow-lg border-4 border-[#1a1a1a] relative">
      <img src="https://files.catbox.moe/lktk7s.png"
           alt="Profile"
           class="w-full h-full object-cover rounded-full"
           onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=Profile+Photo'" />

      <img src="https://files.catbox.moe/6napzi.png"
           alt="Bubble"
           class="absolute -top-6 -right-4 w-20 h-20 object-contain pointer-events-none animate-float-bubble"
           onerror="this.style.display='none'">
    </div>
  </div>

  <!-- Main Content -->
  <div class="container mx-auto px-4 pt-2 pb-28 max-w-md">
    <div class="text-center mb-8">

      <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-1 flex items-center justify-center gap-1 animate-fade-in-up delay-200">
        J-k!zenorv
        <i class="fas fa-circle-check text-base text-blue-500" title="Verified"></i>
      </h2>

      <div class="flex justify-center mb-3 animate-fade-in-up delay-300">
        <div onclick="toggleTaylorPlayer()" class="shiny-badge cursor-pointer inline-flex items-center gap-2 px-4 py-1.5 text-sm shadow-sm hover:bg-white/10 transition-colors">
          <i class="fas fa-music text-white"></i>
          <span>Taylor Swift - Love Story</span>
        </div>
      </div>

      <p class="text-gray-600 dark:text-gray-400 mb-4 animate-fade-in-up delay-300">Hobby</p>

      <p id="typewriter-text" class="text-gray-700 dark:text-gray-300 px-4 text-sm min-h-[3rem] animate-fade-in-up delay-400 typewriter-cursor"></p>

      <div class="flex justify-center mt-3 gap-2 flex-wrap animate-fade-in-up delay-500">
        <span class="badge shiny-badge"><i class="fas fa-music text-white"></i> Music Lover</span>
        <span class="badge shiny-badge"><i class="fas fa-code text-white"></i> Dev</span>
        <span class="badge shiny-badge"><i class="fas fa-gamepad text-white"></i> Gamer</span>
      </div>

      <div class="flex justify-center space-x-4 mt-4 animate-fade-in-up delay-600">
        <a href="https://t.me/zennnorv" class="social-icon"><i class="fab fa-telegram"></i></a>
        <a href="https://github.com/zen0norv" class="social-icon"><i class="fab fa-github"></i></a>
      </div>

      <a href="https://t.me/zennnch" class="block mt-6 animate-fade-in-up delay-700">
        <div class="link-card">
          <div class="icon-box"><i class="fab fa-telegram fa-lg"></i></div>
          <div class="flex-1 text-left min-w-0">
            <h3 class="font-semibold text-white text-sm truncate">Telegram Channel</h3>
            <p class="text-xs text-gray-400 truncate">Join us for updates</p>
          </div>
          <div class="text-gray-500"><i class="fas fa-chevron-right text-sm"></i></div>
        </div>
      </a>

      <a href="https://whatsapp.com/channel/0029VbEDWQMLikg0e1oyf40x" class="block mt-3 animate-fade-in-up delay-800">
        <div class="link-card">
          <div class="icon-box"><i class="fab fa-whatsapp fa-lg"></i></div>
          <div class="flex-1 text-left min-w-0">
            <h3 class="font-semibold text-white text-sm truncate">WhatsApp Channel</h3>
            <p class="text-xs text-gray-400 truncate">Join us for updates</p>
          </div>
          <div class="text-gray-500"><i class="fas fa-chevron-right text-sm"></i></div>
        </div>
      </a>

      <div class="mt-12 text-center text-gray-500 text-xs animate-fade-in-up delay-800">
        <p>Developed with <i class="fas fa-heart text-red-500 mx-1"></i> by <span class="text-gray-300 font-semibold">J-k!zenorv</span></p>
        <p class="mt-1 text-[10px] text-gray-600">© 2025 All rights reserved.</p>
      </div>

    </div>
  </div>

  <!-- FLOATING MUSIC PLAYER -->
  <div id="taylor-player-dock" class="fixed bottom-6 left-4 right-4 z-50 flex justify-center transform translate-y-[150%] opacity-0 transition-all duration-500 ease-in-out pointer-events-none">
    <div class="w-full max-w-md spotify-glass rounded-2xl p-3 flex flex-col gap-2 pointer-events-auto">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="w-12 h-12 rounded-lg overflow-hidden shrink-0 border border-gray-700 shadow-md">
            <img src="https://files.catbox.moe/tnjqna.jpg" alt="Cover" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-white text-sm font-semibold truncate">Taylor Swift - Love Story</div>
            <div class="text-gray-400 text-xs truncate">Taylor Swift</div>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="taylor-play-pause-btn" onclick="toggleTaylorPlayPause()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-black hover:scale-105 transition-transform shadow-lg">
            <i id="taylor-play-pause-icon" class="fas fa-play text-sm ml-0.5"></i>
          </button>
          <button onclick="stopTaylor()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white transition-colors bg-white/5 rounded-full">
            <i class="fas fa-stop text-xs"></i>
          </button>
          <button onclick="closeTaylorPlayer()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
            <i class="fas fa-times text-lg"></i>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-2 text-[10px] text-gray-400 font-medium px-1">
        <span id="taylor-current-time">0:00</span>
        <div class="flex-1 h-1 bg-gray-700/50 rounded-full cursor-pointer relative group" onclick="seekTaylor(event)">
          <div id="taylor-progress-bar" class="h-full bg-white rounded-full w-0 transition-all duration-100 relative group-hover:bg-green-400">
            <div class="absolute right-0 top-1/2 transform -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity"></div>
          </div>
        </div>
        <span id="taylor-duration">0:00</span>
      </div>
      <audio id="taylor-audio" src="https://files.catbox.moe/awtljo.mp3"></audio>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
